# Coraza WAF Configuration for Testing

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# XSS Detection
SecRule ARGS "@rx <script" \
    "id:1001,phase:2,deny,status:403,msg:'XSS Attack: script tag',tag:'attack-xss'"

SecRule ARGS "@rx javascript:" \
    "id:1002,phase:2,deny,status:403,msg:'XSS Attack: javascript protocol',tag:'attack-xss'"

SecRule ARGS "@rx onerror=" \
    "id:1003,phase:2,deny,status:403,msg:'XSS Attack: onerror event',tag:'attack-xss'"

SecRule ARGS "@rx alert\(" \
    "id:1004,phase:2,deny,status:403,msg:'XSS Attack: alert function',tag:'attack-xss'"

# SQL Injection Detection
SecRule ARGS "@rx (?i:union.*select)" \
    "id:2001,phase:2,deny,status:403,msg:'SQL Injection: UNION SELECT',tag:'attack-sqli'"

SecRule ARGS "@rx (?i:or\s+['\"]?1['\"]?\s*=\s*['\"]?1)" \
    "id:2002,phase:2,deny,status:403,msg:'SQL Injection: OR 1=1',tag:'attack-sqli'"

SecRule ARGS "@rx (?i:'\s+or\s+')" \
    "id:2003,phase:2,deny,status:403,msg:'SQL Injection: OR statement',tag:'attack-sqli'"

SecRule ARGS "@rx --" \
    "id:2004,phase:2,deny,status:403,msg:'SQL Injection: comment',tag:'attack-sqli'"

SecRule ARGS "@rx (?i:drop\s+table)" \
    "id:2005,phase:2,deny,status:403,msg:'SQL Injection: DROP TABLE',tag:'attack-sqli'"

SecRule ARGS "@rx (?i:select\s+.*\s+from)" \
    "id:2006,phase:2,deny,status:403,msg:'SQL Injection: SELECT FROM',tag:'attack-sqli'"

# Path Traversal
SecRule ARGS "@rx \.\./\.\." \
    "id:3001,phase:2,deny,status:403,msg:'Path Traversal: dot dot slash',tag:'attack-lfi'"

SecRule ARGS "@rx /etc/passwd" \
    "id:3002,phase:2,deny,status:403,msg:'Path Traversal: /etc/passwd',tag:'attack-lfi'"

SecRule ARGS "@rx (?i:\\\\windows)" \
    "id:3003,phase:2,deny,status:403,msg:'Path Traversal: Windows path',tag:'attack-lfi'"

# Command Injection
SecRule ARGS "@rx (?:;|&&|\|\|)\s*(?:ls|cat|whoami|id|nc|wget|curl|bash|sh)" \
    "id:4001,phase:2,deny,status:403,msg:'Command Injection: shell command',tag:'attack-rce'"

SecRule ARGS "@rx \|\s*(?:cat|type|dir|nc|wget|curl)" \
    "id:4002,phase:2,deny,status:403,msg:'Command Injection: pipe command',tag:'attack-rce'"

SecRule ARGS "@rx %0a" \
    "id:4005,phase:2,deny,status:403,msg:'Command Injection: newline injection',tag:'attack-rce'"

SecRule ARGS "@rx `.*`" \
    "id:4003,phase:2,deny,status:403,msg:'Command Injection: backticks',tag:'attack-rce'"

SecRule ARGS "@rx \$\(.*\)" \
    "id:4004,phase:2,deny,status:403,msg:'Command Injection: command substitution',tag:'attack-rce'"

# SSTI Detection
SecRule ARGS "@rx \{\{.*\}\}" \
    "id:5001,phase:2,deny,status:403,msg:'SSTI: template injection',tag:'attack-ssti'"

SecRule ARGS "@rx \$\{.*\}" \
    "id:5002,phase:2,deny,status:403,msg:'SSTI: EL injection',tag:'attack-ssti'"

SecRule ARGS "@rx #\{.*\}" \
    "id:5003,phase:2,deny,status:403,msg:'SSTI: Thymeleaf injection',tag:'attack-ssti'"

# SSRF Detection
SecRule ARGS "@rx (?i:(?:https?|file)://(?:localhost|127\.0\.0\.1|169\.254\.169\.254|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+\.\d+|metadata\.google\.internal))" \
    "id:6001,phase:2,deny,status:403,msg:'SSRF: internal/metadata URL',tag:'attack-ssrf'"

# XSS in request body (JSON)
SecRule REQUEST_BODY "@rx <script" \
    "id:1005,phase:2,deny,status:403,msg:'XSS Attack: script tag in body',tag:'attack-xss'"

SecRule REQUEST_BODY "@rx onerror=" \
    "id:1006,phase:2,deny,status:403,msg:'XSS Attack: event handler in body',tag:'attack-xss'"

SecRule REQUEST_BODY "@rx onload=" \
    "id:1007,phase:2,deny,status:403,msg:'XSS Attack: onload in body',tag:'attack-xss'"

# Log4Shell / JNDI in headers
SecRule REQUEST_HEADERS "@rx \$\{jndi:" \
    "id:6101,phase:1,deny,status:403,msg:'Log4Shell: JNDI in header',tag:'attack-rce'"

SecRule ARGS "@rx \$\{jndi:" \
    "id:6102,phase:2,deny,status:403,msg:'Log4Shell: JNDI in parameter',tag:'attack-rce'"

# Shellshock in headers
SecRule REQUEST_HEADERS "@rx \(\)\s*\{" \
    "id:6103,phase:1,deny,status:403,msg:'Shellshock: bash function in header',tag:'attack-rce'"

# Struts2 RCE in Content-Type
SecRule REQUEST_HEADERS:Content-Type "@rx ognl" \
    "id:6104,phase:1,deny,status:403,msg:'Struts2: OGNL in Content-Type',tag:'attack-rce'"

# XXE in request body
SecRule REQUEST_BODY "@rx <!(?:DOCTYPE|ENTITY)" \
    "id:7001,phase:2,deny,status:403,msg:'XXE: DOCTYPE/ENTITY in body',tag:'attack-xxe'"

# NoSQL injection in request body
SecRule REQUEST_BODY "@rx \$(?:ne|gt|lt|gte|lte|regex|where|exists)" \
    "id:7002,phase:2,deny,status:403,msg:'NoSQL Injection: MongoDB operator in body',tag:'attack-nosql'"

# Deserialization in request body
SecRule REQUEST_BODY "@rx (?:rO0AB|cos\nystem)" \
    "id:7003,phase:2,deny,status:403,msg:'Insecure Deserialization: serialized object',tag:'attack-deser'"

# LDAP injection
SecRule ARGS "@rx [\(\)]\s*[&|]\s*[\(\)]" \
    "id:7004,phase:2,deny,status:403,msg:'LDAP Injection',tag:'attack-ldap'"

# CI/CD injection in body (command chaining)
SecRule REQUEST_BODY "@rx ;\s*(?:curl|wget|bash|sh)\s" \
    "id:7005,phase:2,deny,status:403,msg:'CI/CD Injection: command in body',tag:'attack-rce'"

# File exposure via URI
SecRule REQUEST_URI "@rx (?:\.env|\.git/|\.git$)" \
    "id:8001,phase:1,deny,status:403,msg:'File Exposure: dotfile access',tag:'attack-disclosure'"

SecRule REQUEST_URI "@rx (?i:\.(?:sql|bak|old|swp|conf|cfg)(?:\.|$))" \
    "id:8002,phase:1,deny,status:403,msg:'File Exposure: backup/config file',tag:'attack-disclosure'"

SecRule REQUEST_URI "@rx (?i:wp-config)" \
    "id:8003,phase:1,deny,status:403,msg:'File Exposure: WordPress config',tag:'attack-disclosure'"

# Log injection (CRLF)
SecRule ARGS "@rx %0[da]" \
    "id:8004,phase:2,deny,status:403,msg:'Log Injection: CRLF in parameter',tag:'attack-log-injection'"

# SSRF via blind callback in body
SecRule REQUEST_BODY "@rx (?i:callback_url|webhook_url|redirect_uri).*https?://" \
    "id:6002,phase:2,deny,status:403,msg:'SSRF: callback URL in body',tag:'attack-ssrf'"

# Custom Block Rules
SecRule REQUEST_METHOD "@streq GET" \
    "id:9001,phase:1,deny,status:403,msg:'Blocked: GET /Dr0v',tag:'custom-block',chain"
    SecRule REQUEST_URI "@streq /Dr0v" ""
