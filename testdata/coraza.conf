SecRuleEngine On
SecRequestBodyAccess On
SecRule ARGS "@contains <script>" "id:1,phase:2,deny,status:403,msg:'XSS Attack Detected',tag:'attack-xss'"
SecRule ARGS "@contains ' OR '1'='1" "id:2,phase:2,deny,status:403,msg:'SQL Injection Detected',tag:'attack-sqli'"
SecRule ARGS "@contains ../../../" "id:3,phase:2,deny,status:403,msg:'Path Traversal Detected',tag:'attack-lfi'"
SecRule REQUEST_BODY "@contains malicious" "id:4,phase:2,deny,status:403,msg:'Malicious Content in Body',tag:'attack-injection'"
SecRule REQUEST_BODY "@contains <script>" "id:5,phase:2,deny,status:403,msg:'XSS in Body',tag:'attack-xss'"
SecRule REQUEST_BODY "@contains DROP TABLE" "id:6,phase:2,deny,status:403,msg:'SQL Injection in Body',tag:'attack-sqli'"
