name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.tag_name }} -X main.commit=${{ github.sha }}" -o wafflex${{ matrix.ext }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf wafflex-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }} wafflex${{ matrix.ext }}

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path wafflex${{ matrix.ext }} -DestinationPath wafflex-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} wafflex-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }} --clobber
